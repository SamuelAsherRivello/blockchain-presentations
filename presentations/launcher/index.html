    <style>

      a:hover { background: #272b35; border-color: #8b5cf6; }
      .repo-link { position: absolute; top: 1rem; right: 1rem; display: grid; width: 2.75rem; height: 2.75rem; padding: 0; place-items: center; }
      .repo-link svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
      .repo-link:focus-visible { outline: 2px solid #8b5cf6; outline-offset: 3px; }
    </style>
